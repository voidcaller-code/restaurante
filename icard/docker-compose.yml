services:
  db:
    container_name: ${DB_NAME}
    image: postgres:16

    volumes:
      - postgres_data:/var/lib/postgresql/data

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    restart: always

volumes:
  postgres_data:
    external: false
